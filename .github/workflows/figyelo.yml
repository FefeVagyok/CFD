name: CFD figyelő

on:
  schedule:
    # Ötpercenként, hétköznap, UTC 12 és 21 óra között (a nyári és téli idő miatt tágabb).
    - cron: "*/5 * * * 0-5"
  workflow_dispatch:
    inputs:
      teszt:
        description: "Csak tesztértesítést küld"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cfd-figyelo
  cancel-in-progress: false

jobs:
  figyel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - name: Futtatás
        env:
          NTFY_TEMA: ${{ secrets.NTFY_TEMA }}
          EGYENLEG: ${{ secrets.EGYENLEG }}
          KOCKAZAT: ${{ secrets.KOCKAZAT }}
          FX: ${{ secrets.FX }}
          SPREAD: ${{ secrets.SPREAD }}
          TICKER: ${{ secrets.TICKER }}
        run: |
          if [ "${{ github.event.inputs.teszt }}" = "true" ]; then
            python figyelo.py --teszt
          else
            python figyelo.py
          fi
      - name: Állapot mentése
        run: |
          if [ -f state.json ] && [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "figyelo-bot"
            git config user.email "figyelo-bot@users.noreply.github.com"
            git add state.json
            git commit -m "állapot frissítése"
            git push
          fi
